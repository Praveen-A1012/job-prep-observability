services:
  app:
    build: ./app
    container_name: job-prep-app
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: job-prep-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: job-prep-grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - prometheus
